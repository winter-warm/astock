[project]
name = "astock-workbench"
version = "0.6.1"
description = "带教学功能的 A 股量化仿真桌面工作台"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "pyqtgraph>=0.13.7,<0.15",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "akshare>=1.17,<2",
  "baostock==0.9.4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pyinstaller>=6.11,<7", "ruff>=0.9,<1"]

[project.gui-scripts]
astock = "astock.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
